name: force_trace
description: "ForceTrace / 力迹 — 基于 Flutter 与 AI 视觉的 VBT 健身辅导记录应用。"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  drift: ^2.35.2
  drift_flutter: ^0.3.1
  sqlite3_flutter_libs: ^0.6.0+eol
  path_provider: ^2.1.6
  path: ^1.9.1
  archive: ^4.5.2
  shared_preferences: ^2.5.6
  fl_chart: ^1.2.0
  camera: ^0.12.1
  sensors_plus: ^7.1.1
  flutter_tts: ^4.2.5
  share_plus: ^13.3.1
  flutter_svg: ^2.3.0
  flutter_body_atlas: ^0.2.3
  intl: ^0.20.3
  collection: ^1.19.1
  google_mlkit_pose_detection: 0.16.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: 2.16.2
  drift_dev: ^2.35.1
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/db/

# Use the SQLite shipped with Windows for desktop/test runs. Mobile and web
# keep package:sqlite3's bundled builds (and Flutter's plugin binaries).
hooks:
  user_defines:
    sqlite3:
      source:
        windows: system
        default: sqlite3
      name:
        windows: winsqlite3
        default: sqlite3
      # GitHub release downloads are slow or blocked on some networks. The
      # hook still verifies the archive against the SHA-256 shipped on pub.dev.
      url_pattern: "https://gh-proxy.com/https://github.com/simolus3/sqlite3.dart/releases/download/$RELEASE_TAG/$FILENAME"
