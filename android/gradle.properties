org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Fail fast when a CDN connection stalls instead of waiting forever.
systemProp.org.gradle.internal.http.connectionTimeout=20000
systemProp.org.gradle.internal.http.socketTimeout=60000
# The pub cache lives on C: while this project lives on F:; Kotlin's
# incremental cache cannot relativize source paths across Windows drives.
kotlin.incremental=false
kotlin.incremental.useClasspathSnapshot=false
