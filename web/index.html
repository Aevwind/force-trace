<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="ForceTrace 力迹 — 基于 Flutter 与 AI 视觉的 VBT 健身辅导记录应用。实时骨骼、杠铃轨迹、速度损失与组后报告。">
  <meta name="theme-color" content="#070B0F">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ForceTrace 力迹">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <title>ForceTrace · 力迹 VBT</title>

  <style>
    :root { color-scheme: dark; }
    html, body {
      margin: 0;
      height: 100%;
      background: #070B0F;
      color: #F4F7FA;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Microsoft YaHei", "Noto Sans SC", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    #boot {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(circle at 78% 12%, rgba(74, 222, 128, 0.10), transparent 46%),
        radial-gradient(circle at 10% 88%, rgba(251, 146, 60, 0.06), transparent 40%),
        linear-gradient(180deg, #0B1117 0%, #05080B 100%);
      transition: opacity 0.35s ease;
      z-index: 1000;
    }
    #boot .mark {
      width: 116px;
      height: 116px;
      border-radius: 30px;
      border: 3px solid #4ADE80;
      box-shadow: 0 0 34px rgba(74, 222, 128, 0.28), inset 0 0 24px rgba(74, 222, 128, 0.07);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 26px;
      background: rgba(10, 18, 22, 0.6);
    }
    #boot .mark svg { width: 82px; height: 82px; }
    #boot .name {
      font-size: 24px;
      font-weight: 900;
      letter-spacing: 7px;
      color: #F4F7FA;
      text-indent: 7px;
    }
    #boot .sub {
      margin-top: 8px;
      font-size: 11px;
      letter-spacing: 2.4px;
      color: #64748B;
    }
    #boot .track {
      width: 168px;
      height: 2px;
      margin-top: 34px;
      background: rgba(255, 255, 255, 0.08);
      overflow: hidden;
      border-radius: 2px;
    }
    #boot .track span {
      display: block;
      width: 42%;
      height: 100%;
      background: #4ADE80;
      border-radius: 2px;
      animation: load 1.25s ease-in-out infinite;
      box-shadow: 0 0 12px rgba(74, 222, 128, 0.8);
    }
    @keyframes load {
      0% { transform: translateX(-110%); }
      100% { transform: translateX(360%); }
    }
    #boot .hint {
      margin-top: 14px;
      font-size: 10px;
      letter-spacing: 0.6px;
      color: #475569;
    }
    #boot .error {
      display: none;
      margin-top: 20px;
      max-width: 320px;
      padding: 12px 16px;
      border: 1px solid rgba(248, 113, 113, 0.35);
      border-radius: 12px;
      background: rgba(248, 113, 113, 0.06);
      color: #FCA5A5;
      font-size: 11px;
      line-height: 1.6;
      text-align: center;
    }
  </style>
</head>
<body>
  <div id="boot">
    <div class="mark" aria-hidden="true">
      <svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
        <line x1="20" y1="60" x2="100" y2="60" stroke="#F4F7FA" stroke-width="5" stroke-linecap="round" />
        <rect x="24" y="38" width="10" height="44" rx="5" fill="#4ADE80" />
        <rect x="40" y="30" width="11" height="60" rx="5" fill="#4ADE80" />
        <rect x="69" y="30" width="11" height="60" rx="5" fill="#4ADE80" />
        <rect x="86" y="38" width="10" height="44" rx="5" fill="#4ADE80" />
        <polyline points="14,60 46,60 53,44 60,76 67,50 74,60 106,60"
          fill="none" stroke="#FB923C" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
    </div>
    <div class="name">FORCETRACE</div>
    <div class="sub">力迹 · AI 视觉 VBT 训练教练</div>
    <div class="track"><span></span></div>
    <div class="hint">正在载入 1,324 个动作 · 10 种语言</div>
    <div class="error" id="boot-error">
      应用加载失败。请确认浏览器支持 WebAssembly 并刷新页面。
    </div>
  </div>

  <script>
    (function () {
      var boot = document.getElementById('boot');
      var hidden = false;
      function hideBoot() {
        if (hidden || !boot) return;
        hidden = true;
        boot.style.opacity = '0';
        window.setTimeout(function () {
          if (boot && boot.parentNode) boot.parentNode.removeChild(boot);
        }, 380);
      }
      window.addEventListener('flutter-first-frame', hideBoot);
      window.addEventListener('error', function (event) {
        if (!hidden && event && event.target && event.target.tagName === 'SCRIPT') {
          var error = document.getElementById('boot-error');
          if (error) error.style.display = 'block';
        }
      }, true);
      // Do not trap the user forever if the engine fails before first frame.
      window.setTimeout(function () {
        var error = document.getElementById('boot-error');
        if (!hidden && error) error.style.display = 'block';
      }, 20000);
    })();
  </script>
  <noscript>ForceTrace 需要启用 JavaScript。</noscript>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
